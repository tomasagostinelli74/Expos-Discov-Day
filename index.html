<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aranceles UADE</title>
<meta name="description" content="Consultá los aranceles de todas las carreras de UADE, por facultad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #121f2f;
    --navy-2: #1b2d44;
    --ink: #172231;
    --muted: #5d6878;
    --line: #e4e1da;
    --bg: #f6f4ef;
    --card: #ffffff;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(18,31,47,.06), 0 8px 24px rgba(18,31,47,.06);
    --shadow-lg: 0 2px 4px rgba(18,31,47,.08), 0 18px 40px rgba(18,31,47,.14);
    --fac: #121f2f;
    --fac-soft: #eef0f3;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid #f2b84b; outline-offset: 2px; border-radius: 8px; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 720px) { .wrap { padding: 0 32px; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    background:
      radial-gradient(900px 420px at 88% -10%, rgba(29,78,216,.35), transparent 60%),
      radial-gradient(700px 380px at -5% 110%, rgba(122,31,61,.45), transparent 60%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
  }
  .topbar { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .topbar a.brand { display: inline-flex; }
  .logo { height: 30px; width: auto; filter: brightness(0) invert(1); }
  .cohort {
    display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  }
  .cohort span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.7); padding: 0 8px 0 10px; }
  .cohort button {
    border: 0; background: transparent; color: #fff; font: inherit; font-size: 14px; font-weight: 700;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; transition: background .2s ease, color .2s ease;
  }
  .cohort button:hover { background: rgba(255,255,255,.12); }
  .cohort button[aria-pressed="true"], .cohort b { background: #fff; color: var(--navy); }
  .cohort b { font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 999px; }
  .fac-hero .cohort button[aria-pressed="true"], .fac-hero .cohort b { color: var(--fac); }
  @media (max-width: 380px) { .cohort span { display: none; } }
  .hero-body { position: relative; z-index: 1; padding: 36px 0 64px; max-width: 760px; }
  .hero-body.compact { padding: 8px 0 40px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.65); margin: 0 0 14px; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.04; }
  .hero h1 em { font-style: normal; color: #f2b84b; }
  .hero p.lead { font-size: clamp(16px, 2vw, 19px); color: rgba(255,255,255,.78); margin: 18px 0 30px; max-width: 560px; }

  .search {
    display: flex; align-items: center; gap: 12px; background: #fff; color: var(--ink);
    border-radius: 16px; padding: 6px 6px 6px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
    max-width: 620px;
  }
  .search svg.i { font-size: 20px; color: var(--muted); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; padding: 12px 0; color: var(--ink);
  }
  .search input::placeholder { color: #8a93a1; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search button.clear {
    border: 0; background: var(--bg); color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 14px; border-radius: 12px; cursor: pointer;
  }
  .search button.clear[hidden] { display: none; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; font-size: 14px; color: rgba(255,255,255,.7); }
  .stats b { color: #fff; font-weight: 700; }

  /* ---------- Sections ---------- */
  main { padding: 48px 0 72px; }
  .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .section-head h2 { font-size: clamp(24px, 3vw, 32px); }
  .section-head p { margin: 4px 0 0; color: var(--muted); }

  /* ---------- Faculty grid ---------- */
  .fac-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  .fac-card {
    --c: #333;
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 196px; padding: 22px; border-radius: var(--radius); text-decoration: none; color: #fff;
    background: linear-gradient(150deg, color-mix(in srgb, var(--c) 82%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 75%, #000) 100%);
    box-shadow: var(--shadow); transition: transform .25s ease, box-shadow .25s ease;
    animation: rise .5s ease both;
  }
  .fac-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .fac-card .wm { position: absolute; right: -18px; bottom: -22px; font-size: 150px; opacity: .14; transition: transform .4s ease; }
  .fac-card:hover .wm { transform: rotate(-8deg) scale(1.06); }
  .fac-card .ico {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(4px);
  }
  .fac-card .code { font-size: 12px; font-weight: 800; letter-spacing: .16em; opacity: .8; margin: 18px 0 4px; }
  .fac-card h3 { font-size: 22px; line-height: 1.15; }
  .fac-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 14px; font-weight: 600; position: relative; }
  .fac-card .go { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--c); transition: transform .25s ease; }
  .fac-card:hover .go { transform: translateX(4px); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .help {
    margin-top: 28px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  }
  .help .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: #fdf3df; color: #b7791f; font-size: 20px; flex: none; }
  .help div { flex: 1; min-width: 220px; }
  .help strong { display: block; }
  .help span { color: var(--muted); font-size: 14px; }

  /* ---------- Buttons / chips ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--fac); color: #fff; transition: filter .2s ease, transform .2s ease; white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--fac-soft); color: var(--fac); }
  /* ---------- Faculty view ---------- */
  .fac-hero { background:
      radial-gradient(700px 360px at 95% -20%, rgba(255,255,255,.18), transparent 60%),
      linear-gradient(150deg, color-mix(in srgb, var(--fac) 85%, #fff) 0%, var(--fac) 50%, color-mix(in srgb, var(--fac) 70%, #000) 100%); }
  .back {
    display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 8px 14px 8px 10px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
    transition: background .2s ease;
  }
  .back:hover { background: rgba(255,255,255,.24); }
  .fac-title { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
  .fac-title .ico { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 30px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); flex: none; }
  .fac-title .code { font-size: 13px; font-weight: 800; letter-spacing: .16em; opacity: .8; }
  .fac-title h1 { font-size: clamp(28px, 5vw, 46px); line-height: 1.05; }

  .toolbar {
    display: flex; flex-direction: column; gap: 12px; margin: 0 -16px 22px; padding: 12px 16px;
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  @media (min-width: 720px) { .toolbar { margin: 0 -32px 26px; padding: 12px 32px; } }
  .toolbar .search { box-shadow: var(--shadow); max-width: none; border: 1px solid var(--line); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 14px; border-radius: 999px; cursor: pointer; transition: all .2s ease;
  }
  .tab .n { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .tab[aria-pressed="true"] { background: var(--fac); border-color: var(--fac); color: #fff; }
  .tab[aria-pressed="true"] .n { color: rgba(255,255,255,.75); }

  .ingreso {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--fac);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 22px; transition: box-shadow .2s ease;
  }
  .ingreso:hover { box-shadow: var(--shadow); }
  .ingreso .ico { font-size: 22px; color: var(--fac); }
  .ingreso div { flex: 1; min-width: 200px; }
  .ingreso strong { display: block; }
  .ingreso span { color: var(--muted); font-size: 14px; }
  .ingreso .more { font-weight: 700; color: var(--fac); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }

  .group-title { font-family: Manrope, sans-serif; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 30px 0 14px; display: flex; align-items: center; gap: 12px; }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-title:first-child { margin-top: 0; }

  .careers { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .career {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 14px;
    transition: box-shadow .25s ease, border-color .25s ease;
    animation: rise .4s ease both;
  }
  .career:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--fac) 30%, var(--line)); }
  .career h3 { font-family: Manrope, sans-serif; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .career .variant { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--fac); }
  .career .fac-name { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .career .fac-name i { width: 8px; height: 8px; border-radius: 50%; background: var(--fac); display: inline-block; }

  .empty { text-align: center; padding: 56px 16px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: center; }
  footer img { height: 20px; opacity: .7; }

  /* ---------- Teléfono ---------- */
  @media (max-width: 640px) {
    body { font-size: 15px; }
    .topbar { padding: 14px 0; }
    .logo { height: 24px; }
    .cohort { padding: 3px; }
    .cohort span { font-size: 11px; padding: 0 6px 0 8px; }
    .cohort b, .cohort button { font-size: 13px; padding: 6px 11px; }
    .hero-body { padding: 14px 0 30px; }
    .hero-body.compact { padding: 4px 0 22px; }
    .eyebrow { font-size: 11px; margin-bottom: 10px; }
    .hero h1 { font-size: 32px; }
    .hero p.lead { font-size: 15px; margin: 12px 0 20px; }
    .search { padding: 4px 4px 4px 14px; border-radius: 14px; }
    .search input { font-size: 16px; padding: 11px 0; }
    .search button.clear { padding: 9px 11px; font-size: 13px; }
    .stats { gap: 4px 14px; margin-top: 14px; font-size: 13px; }

    main { padding: 24px 0 48px; }
    .section-head { margin-bottom: 14px; }
    .section-head h2 { font-size: 22px; }
    .section-head p { font-size: 14px; }

    .fac-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .fac-card { min-height: 150px; padding: 14px; border-radius: 16px; }
    .fac-card:last-child:nth-child(odd) { grid-column: span 2; min-height: 120px; }
    .fac-card .wm { font-size: 96px; right: -14px; bottom: -16px; }
    .fac-card .ico { width: 36px; height: 36px; border-radius: 11px; font-size: 18px; }
    .fac-card .code { font-size: 11px; margin: 10px 0 2px; }
    .fac-card h3 { font-size: 16px; line-height: 1.2; }
    .fac-card .foot { margin-top: 10px; font-size: 12px; }
    .fac-card .go { width: 28px; height: 28px; }
    .fac-card:hover { transform: none; }
    .help { margin-top: 18px; padding: 14px; gap: 12px; }
    .help .btn { width: 100%; }

    .back { font-size: 13px; padding: 6px 12px 6px 8px; }
    .fac-title { gap: 12px; margin-top: 16px; }
    .fac-title .ico { width: 46px; height: 46px; border-radius: 14px; font-size: 22px; }
    .fac-title .code { font-size: 11px; }
    .fac-title h1 { font-size: 24px; line-height: 1.12; }

    .ingreso { padding: 12px 14px; gap: 10px; margin-bottom: 4px; border-left-width: 4px; }
    .ingreso div { min-width: 0; }
    .ingreso span { font-size: 13px; }
    .ingreso .more { width: 100%; padding-left: 32px; }
    .tab { padding: 8px 12px; font-size: 13px; }
    .group-title { font-size: 12px; margin: 22px 0 10px; }

    .careers { gap: 10px; }
    .career { padding: 16px; gap: 12px; border-radius: 14px; animation: none; }
    .career h3 { font-size: 16px; }
    .career .variant { font-size: 13px; }
    .btn { min-height: 44px; padding: 10px 16px; }
    footer { padding: 22px 0 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="hero" id="hero"></header>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <img src="logo_uade.png" alt="UADE">
    <span id="foot-note"></span>
  </div>
</footer>

<script>
/* =====================================================================
   CONFIGURACIÓN — editar acá
   ===================================================================== */
const CONFIG = {
  // Períodos de ingreso a la venta. Con uno solo se muestra como etiqueta;
  // con más de uno aparece un selector (el primero es el que abre por defecto).
  // Para volver a vender Agosto, descomentar su línea: los links ya están cargados.
  cohortes: [
    { id: 'marzo',  nombre: 'Ingreso Marzo 2027', corto: 'Marzo 2027', examenIngreso: 'https://www.uade.edu.ar/media/mhdiytix/cronograma-sia-marzo-2027.pdf' },
    // { id: 'agosto', nombre: 'Ingreso Agosto', corto: 'Agosto', examenIngreso: '' },
  ],
  notaPie: 'Los aranceles se publican en PDF y pueden actualizarse. Verificá siempre la versión vigente.',
};

// Orden en que se muestran las facultades en el menú principal.
const FACULTADES = [
  { id: 'FACE', nombre: 'Ciencias Económicas',               color: '#15803d', icono: 'chart'   },
  { id: 'FAJU', nombre: 'Ciencias Jurídicas y Comunicación', color: '#b91c1c', icono: 'scale'   },
  { id: 'FARU', nombre: 'Arquitectura y Urbanismo',          color: '#7a1f3d', icono: 'columns' },
  { id: 'FAEN', nombre: 'Entretenimiento, Hospitalidad y Medios', color: '#1d4ed8', icono: 'mic'     },
  { id: 'FASA', nombre: 'Ciencias de la Salud',              color: '#7e22ce', icono: 'heart'   },
  { id: 'FAIN', nombre: 'Ingeniería y Ciencias Exactas',     color: '#b7791f', icono: 'cpu'     },
  { id: 'FADI', nombre: 'Diseño',                            color: '#c2410c', icono: 'palette' },
];

/* =====================================================================
   CARRERAS — [FACULTAD, NOMBRE, LINK PDF MARZO, LINK PDF AGOSTO]
   · Hoy solo se muestra Marzo (ver CONFIG.cohortes); la columna Agosto queda guardada.
   · Fuente: crm.uade.edu.ar/Aranceles (FACO figura acá como FAEN; Comunicación,
     Comunicación Global, Publicidad y RR.PP. pasaron a FAJU).
   · Si una carrera no tiene arancel para un ingreso, dejar ese link en ''.
   · Las variantes de sede/modalidad van entre paréntesis y se agrupan
     solas bajo la misma carrera: "Abogacía (Sede Recoleta)".
   ===================================================================== */
const CARRERAS = [
  ["FAJU", "Abogacía", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogaciaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogaciaAgosto.pdf"],
  ["FAJU", "Abogacía (Mod. Intensiva)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogacia_intensivaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogacia_intensivaAgosto.pdf"],
  ["FAJU", "Abogacía (Sede Recoleta)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogacia_recoletaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogacia_recoletaAgosto.pdf"],
  ["FAJU", "Abogacía (Costa Argentina)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogacia_pinaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogacia_pinaAgosto.pdf"],
  ["FAJU", "Abogacía - Sede Costa Argentina (Cursada híbrida)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogacia_pina_hibridaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogacia_pina_hibridaAgosto.pdf"],
  ["FAJU", "Abogacía (Cursada híbrida)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/abogacia_hibridaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/abogacia_hibridaAgosto.pdf"],
  ["FAJU", "Diplomatura en Derecho y Tecnología", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/diploderechoytecnoMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/diploderechoytecnoAgosto.pdf"],
  ["FAJU", "Doble Titulación Abogacía y Gobierno y Relaciones Internacionales (Sede Recoleta)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/pcabogobrelint_recoletaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/pcabogobrelint_recoletaAgosto.pdf"],
  ["FAJU", "Doble Titulación en Política y Administración Pública y Gobierno y Relaciones Internacionales Mod. Flexible", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/politica_hibridaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/politica_hibridaAgosto.pdf"],
  ["FAJU", "Licenciatura en Criminología y Ciberdelito", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/criminologiaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/criminologiaAgosto.pdf"],

  ["FADI", "Licenciatura en diseño y gestión de estéticas para la moda", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/disenio_modaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/disenio_modaAgosto.pdf"],
  ["FADI", "Licenciatura en Diseño y Gestión de Estéticas para la Moda (Sede Recoleta)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/disenio_moda_recoletaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/disenio_moda_recoletaAgosto.pdf"],
  ["FADI", "Plan conjunto licenciado en diseño gráfico - Licenciado en diseño multimedia y de interacción", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/grafico_multimediaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/grafico+multimediaAgosto.pdf"],
  ["FARU", "Arquitectura", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/arquitecturaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/arquitecturaAgosto.pdf"],
  ["FARU", "Arquitectura (Costa Argentina)", "https://www.dre.uade.edu.ar/Aranceles/01Marzo/arquitectura_pinaMarzo.pdf", "https://www.dre.uade.edu.ar/Aranceles/02Agosto/arquitectura_pinaAgosto.pdf"]
];

/* ===================================================================== */

const ICONS = {
  chart:   '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  scale:   '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  columns: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
  mic:     '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  heart:   '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  cpu:     '<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  palette: '<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2Z"/>',
  search:  '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

  file:    '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13h4M10 17h4M8 9h2"/>',

};
const icon = (name, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

/* ---------- Agrupar variantes de sede / modalidad ---------- */

// Etiqueta canónica de cada modalidad o sede reconocida (el orden define cómo se muestran).
const MODS = [
  [/costa/i,                 'Sede Costa Argentina'],
  [/recoleta/i,              'Sede Recoleta'],
  [/belgrano/i,              'Sede Belgrano'],
  [/monserrat/i,             'Sede Monserrat'],
  [/online/i,                'Online'],
  [/h[ií]brid/i,             'Cursada híbrida'],
  [/flexib/i,                'Mod. Flexible'],
  [/intensiv/i,              'Mod. Intensiva'],
];
const isMod = s => MODS.some(([re]) => re.test(s)) && !/ciclo/i.test(s);
const TRAILING = [/\s+-\s+Sede\s+.+$/i, /\s+Sede\s+\S+$/i, /\s+(Belgrano|Recoleta|Monserrat)$/i, /\s*-?\s*Mod\.\s*Flexible$/i, /\s*-?\s*Flexible$/i, /\s+Online$/i];

function splitName(name) {
  const found = [];
  let base = name.replace(/\s*\(([^)]*)\)/g, (m, inner) => isMod(inner) ? (found.push(inner), ' ') : m);
  base = base.replace(/\s+/g, ' ').trim();
  for (let changed = true; changed;) {
    changed = false;
    for (const re of TRAILING) {
      const m = base.match(re);
      if (m) { found.push(m[0]); base = base.slice(0, m.index).trim(); changed = true; }
    }
    base = base.replace(/[\s\-–,]+$/, '');
  }
  const labels = MODS.filter(([re]) => found.some(f => re.test(f))).map(([, l]) => l);
  return { base, mods: labels };
}

function category(base) {
  const n = norm(base);
  if (/^(diplomatura|programa corto|curso)/.test(n)) return 'Diplomaturas y cursos';
  if (/^(plan conjunto|programa conjunto|doble titulacion)/.test(n)) return 'Dobles titulaciones';
  if (/\bciclo\b/.test(n)) return 'Ciclos de complementación';
  if (/^(tecnicatura|cocinero|martillero)/.test(n)) return 'Tecnicaturas y carreras cortas';
  return 'Carreras de grado';
}
const CAT_ORDER = ['Carreras de grado', 'Dobles titulaciones', 'Ciclos de complementación', 'Tecnicaturas y carreras cortas', 'Diplomaturas y cursos'];

const upperCount = s => (s.match(/[A-ZÁÉÍÓÚÑ]/g) || []).length;
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);

const FAC = Object.fromEntries(FACULTADES.map(f => [f.id, f]));

// Agrupa las carreras que tienen arancel publicado para el ingreso `coh` (índice en CONFIG.cohortes).
function build(coh) {
  const programs = [];
  const groups = new Map();
  for (const row of CARRERAS) {
    const [fac, name] = row;
    const link = row[2 + coh];
    if (!FAC[fac] || !link) continue;
    const { base, mods } = splitName(name);
    const key = fac + '|' + norm(base);
    if (!groups.has(key)) groups.set(key, { fac, names: [], main: null, variants: [] });
    const g = groups.get(key);
    g.names.push(base);
    if (!mods.length && !g.main) g.main = link;
    else g.variants.push({ label: mods.join(' · ') || name, link });
  }
  for (const g of groups.values()) {
    const display = capFirst(g.names.reduce((a, b) => upperCount(b) > upperCount(a) ? b : a));
    const seen = new Set();
    g.variants = g.variants
      .filter(v => !seen.has(v.label) && seen.add(v.label))
      .sort((a, b) => a.label.localeCompare(b.label, 'es'));
    programs.push({
      fac: g.fac, name: display, cat: category(display), main: g.main, variants: g.variants,
      search: norm(display + ' ' + g.variants.map(v => v.label).join(' ')),
    });
  }
  return programs.sort((a, b) => a.name.localeCompare(b.name, 'es'));
}

/* ---------- Render ---------- */

const $hero = document.getElementById('hero');
const $app = document.getElementById('app');
document.getElementById('foot-note').textContent = CONFIG.notaPie;

const state = { q: '', cat: 'Todas', coh: 0 };
try {
  const saved = CONFIG.cohortes.findIndex(c => c.id === sessionStorage.getItem('cohorte'));
  if (saved >= 0) state.coh = saved;
} catch (e) {}
let PROGRAMS = build(state.coh);
const cohorte = () => CONFIG.cohortes[state.coh];

function setCohort(i) {
  if (i === state.coh) return;
  state.coh = i;
  try { sessionStorage.setItem('cohorte', cohorte().id); } catch (e) {}
  PROGRAMS = build(i);
  route(true);
}

function setFacColors(fac) {
  const root = document.documentElement.style;
  if (fac) {
    root.setProperty('--fac', fac.color);
    root.setProperty('--fac-soft', `color-mix(in srgb, ${fac.color} 10%, #fff)`);
  } else {
    root.removeProperty('--fac');
    root.removeProperty('--fac-soft');
  }
}

const topbar = () => `
  <div class="topbar">
    <a class="brand" href="#" aria-label="Inicio"><img class="logo" src="logo_uade.png" alt="UADE"></a>
    <div class="cohort" role="group" aria-label="Período de ingreso">
      <span>Ingreso</span>
      ${CONFIG.cohortes.length === 1
        ? `<b>${esc(cohorte().corto)}</b>`
        : CONFIG.cohortes.map((c, i) => `<button type="button" data-coh="${i}" aria-pressed="${i === state.coh}">${esc(c.corto)}</button>`).join('')}
    </div>
  </div>`;

const searchBox = (placeholder) => `
  <label class="search">
    ${icon('search')}
    <span class="sr-only">${esc(placeholder)}</span>
    <input id="q" type="search" autocomplete="off" placeholder="${esc(placeholder)}" value="${esc(state.q)}">
    <button type="button" class="clear" id="clear" ${state.q ? '' : 'hidden'}>Limpiar</button>
  </label>`;

// Una tarjeta por arancel (PDF): la carrera principal y cada sede/modalidad por separado.
function cardsOf(programs) {
  const items = [];
  for (const p of programs) {
    if (p.main) items.push({ p, label: '', link: p.main });
    for (const v of p.variants) items.push({ p, label: v.label, link: v.link });
  }
  for (const it of items) it.search = norm(it.p.name + ' ' + it.label);
  return items;
}

function careerCard(it, showFac) {
  const fac = FAC[it.p.fac];
  const style = showFac ? ` style="--fac:${fac.color};--fac-soft:color-mix(in srgb, ${fac.color} 10%, #fff)"` : '';
  return `
  <article class="career"${style}>
    <div>
      <h3>${esc(it.p.name)}</h3>
      ${it.label ? `<div class="variant">${icon(/Sede/.test(it.label) ? 'pin' : 'info')}${esc(it.label)}</div>` : ''}
      ${showFac ? `<div class="fac-name"><i></i>${esc(fac.nombre)}</div>` : ''}
    </div>
    <a class="btn" href="${esc(it.link)}" target="_blank" rel="noopener" aria-label="Ver arancel de ${esc(it.p.name + (it.label ? ' · ' + it.label : ''))}">${icon('file')}Ver arancel</a>
  </article>`;
}

const emptyState = (q) => `
  <div class="empty">
    <strong>No encontramos “${esc(q)}”</strong>
    Probá con otra palabra, por ejemplo “diseño”, “online” o “Recoleta”.
  </div>`;

function renderHome() {
  setFacColors(null);
  document.title = 'Aranceles UADE';
  $hero.className = 'hero';
  $hero.innerHTML = `
    <div class="wrap">
      ${topbar()}
      <div class="hero-body">
        <p class="eyebrow">Aranceles de grado y pregrado</p>
        <h1>Encontrá el arancel de <em>tu carrera</em></h1>
        <p class="lead">Elegí tu facultad o buscá la carrera directamente. Cada arancel incluye sede y modalidad de cursada.</p>
        ${searchBox('Buscá tu carrera…')}
        <div class="stats">
          <span><b>${FACULTADES.length}</b> facultades</span>
          <span><b>${PROGRAMS.length}</b> propuestas académicas</span>
          <span><b>${PROGRAMS.reduce((n, p) => n + p.variants.length + (p.main ? 1 : 0), 0)}</b> opciones de sede y modalidad</span>
        </div>
      </div>
    </div>`;
  bindSearch(renderHomeBody);
  renderHomeBody();
}

function renderHomeBody() {
  const q = norm(state.q);
  if (q) {
    const terms = q.split(' ');
    const hits = cardsOf(PROGRAMS).filter(it => terms.every(t => it.search.includes(t) || norm(FAC[it.p.fac].nombre).includes(t) || it.p.fac.toLowerCase() === t));
    $app.innerHTML = `
      <div class="section-head">
        <div><h2>Resultados</h2><p>${hits.length} ${hits.length === 1 ? 'arancel encontrado' : 'aranceles encontrados'}</p></div>
      </div>
      ${hits.length ? `<div class="careers">${hits.map(it => careerCard(it, true)).join('')}</div>` : emptyState(state.q)}`;
    return;
  }
  $app.innerHTML = `
    <div class="section-head">
      <div><h2>Facultades</h2><p>Elegí una facultad para ver los aranceles de sus carreras.</p></div>
    </div>
    <div class="fac-grid">
      ${FACULTADES.map((f, i) => {
        const n = PROGRAMS.filter(p => p.fac === f.id).length;
        return `
        <a class="fac-card" href="#/${f.id}" style="--c:${f.color};animation-delay:${i * 45}ms">
          <span class="wm">${icon(f.icono)}</span>
          <div>
            <span class="ico">${icon(f.icono)}</span>
            <div class="code">${f.id}</div>
            <h3>${esc(f.nombre)}</h3>
          </div>
          <div class="foot">
            <span>${n} ${n === 1 ? 'propuesta' : 'propuestas'}</span>
            <span class="go">${icon('right')}</span>
          </div>
        </a>`;
      }).join('')}
    </div>
    ${cohorte().examenIngreso ? `
    <div class="help">
      <span class="ico">${icon('calendar')}</span>
      <div>
        <strong>Examen de ingreso</strong>
        <span>Consultá fechas y cronograma del examen de ingreso.</span>
      </div>
      <a class="btn" style="--fac:#121f2f" href="${esc(cohorte().examenIngreso)}" target="_blank" rel="noopener">Ver cronograma ${icon('right')}</a>
    </div>` : ''}`;
}

function renderFaculty(fac) {
  setFacColors(fac);
  document.title = `${fac.nombre} · Aranceles UADE`;
  const progs = PROGRAMS.filter(p => p.fac === fac.id);
  const items = cardsOf(progs);
  $hero.className = 'hero fac-hero';
  $hero.innerHTML = `
    <div class="wrap">
      ${topbar()}
      <div class="hero-body compact">
        <a class="back" href="#">${icon('left')}Todas las facultades</a>
        <div class="fac-title">
          <span class="ico">${icon(fac.icono)}</span>
          <div>
            <div class="code">FACULTAD · ${fac.id}</div>
            <h1>${esc(fac.nombre)}</h1>
          </div>
        </div>
      </div>
    </div>`;
  const cats = CAT_ORDER.filter(c => progs.some(p => p.cat === c));
  if (!cats.includes(state.cat)) state.cat = 'Todas';
  $app.innerHTML = `
    ${cohorte().examenIngreso ? `
    <a class="ingreso" href="${esc(cohorte().examenIngreso)}" target="_blank" rel="noopener">
      <span class="ico">${icon('calendar')}</span>
      <div><strong>Examen de ingreso</strong><span>Fechas y cronograma para ${esc(cohorte().nombre.toLowerCase())}.</span></div>
      <span class="more">Ver cronograma ${icon('right')}</span>
    </a>` : ''}
    <div class="toolbar">
      ${searchBox('Buscá una carrera…')}
      ${cats.length > 1 ? `<div class="tabs" role="toolbar" aria-label="Tipo de propuesta">
        ${['Todas', ...cats].map(c => {
          const n = c === 'Todas' ? items.length : items.filter(it => it.p.cat === c).length;
          return `<button type="button" class="tab" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)}<span class="n">${n}</span></button>`;
        }).join('')}
      </div>` : ''}
    </div>
    <div id="list"></div>`;
  $app.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    state.cat = b.dataset.cat;
    $app.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t === b));
    renderList();
  }));
  const renderList = () => {
    const q = norm(state.q);
    const terms = q ? q.split(' ') : [];
    const hits = items.filter(it => (state.cat === 'Todas' || it.p.cat === state.cat) && terms.every(t => it.search.includes(t)));
    const $list = document.getElementById('list');
    if (!hits.length) { $list.innerHTML = progs.length ? emptyState(state.q) : `<div class="empty"><strong>Próximamente</strong>Todavía no hay aranceles publicados para esta facultad en el ${esc(cohorte().nombre.toLowerCase())}.</div>`; return; }
    const byCat = state.cat === 'Todas' && !q;
    $list.innerHTML = byCat
      ? cats.map(c => `<h2 class="group-title">${esc(c)}</h2><div class="careers">${hits.filter(it => it.p.cat === c).map(it => careerCard(it)).join('')}</div>`).join('')
      : `<div class="careers">${hits.map(it => careerCard(it)).join('')}</div>`;
  };
  bindSearch(renderList);
  renderList();
}

function bindSearch(onChange) {
  const input = document.getElementById('q');
  const clear = document.getElementById('clear');
  input.addEventListener('input', () => {
    state.q = input.value;
    clear.hidden = !state.q;
    onChange();
  });
  clear.addEventListener('click', () => {
    input.value = state.q = '';
    clear.hidden = true;
    input.focus();
    onChange();
  });
}

function route(keep) {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, '')).toUpperCase();
  if (keep !== true) { state.q = ''; state.cat = 'Todas'; }
  if (FAC[id]) renderFaculty(FAC[id]); else renderHome();
  $hero.querySelectorAll('[data-coh]').forEach(b => b.addEventListener('click', () => setCohort(+b.dataset.coh)));
  if (keep !== true) window.scrollTo({ top: 0, behavior: 'instant' });
}
window.addEventListener('hashchange', () => route());
route();
</script>
